# Default ci.yml for a Rust-only plugin: copy to .github/workflows/ci.yml.
# A crate over the default runners' memory cap sets `runs-on: ci-large` (and
# optionally rust-setup's build-jobs/debuginfo) on every job.

# Required checks are exactly the jobs `build`, `test` and `lint`. Tests run
# once, coverage-instrumented: `test` also reports coverage (report-only).
# Each job composes tool actions as steps, so each job IS one
# check (no reusable-workflow `caller / called` duplicates). Later lint steps
# run `if: !cancelled()` so every linter reports even when an earlier one fails.
# `build` and `test` skip their heavy steps when the source hash already
# passed (see the README's pass cache section); `lint` always runs.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the pass cache and run build + test in full'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # CI-only: link the image's system OpenSSL instead of compiling openssl-src.
  # Release builds do not set this, so shipped binaries keep vendoring it.
  OPENSSL_NO_VENDOR: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    # ci-rust bakes in the toolchain, sccache and Node; its tag tracks
    # orca/rust-toolchain.toml.
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    # Gitea runs `run:` in a custom container with sh (dash); force bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Source hash
        id: src
        uses: argyle-labs/.github/.github/actions/source-hash@main
        with:
          image: ci-rust:1.95.0
          workflow-file: .github/workflows/ci.yml
      - name: Check pass cache
        id: pass
        uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
        with:
          mode: check
          job: build
          also-require: test
          hash: ${{ steps.src.outputs.hash }}
          force: ${{ (inputs.force || github.event_name == 'schedule') && 'true' || 'false' }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Reuse unchanged pass
        if: ${{ steps.pass.outputs.hit == 'true' }}
        env:
          PASS_SHA: ${{ steps.pass.outputs.sha }}
        run: echo "Unchanged source — reusing pass from ${PASS_SHA:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Rust (toolchain, sccache)
        if: ${{ steps.pass.outputs.hit != 'true' }}
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Build test archive (cargo llvm-cov nextest-archive)
        if: ${{ steps.pass.outputs.hit != 'true' }}
        uses: argyle-labs/.github/.github/actions/cargo-build@main
      - name: Record pass
        if: ${{ success() && steps.pass.outputs.hit != 'true' }}
        uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
        with:
          mode: record
          job: build
          hash: ${{ steps.src.outputs.hash }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Source hash
        id: src
        uses: argyle-labs/.github/.github/actions/source-hash@main
        with:
          image: ci-rust:1.95.0
          workflow-file: .github/workflows/ci.yml
      - name: Check pass cache
        id: pass
        uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
        with:
          mode: check
          job: test
          hash: ${{ steps.src.outputs.hash }}
          force: ${{ (inputs.force || github.event_name == 'schedule') && 'true' || 'false' }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Reuse unchanged pass
        if: ${{ steps.pass.outputs.hit == 'true' }}
        env:
          PASS_SHA: ${{ steps.pass.outputs.sha }}
        run: echo "Unchanged source — reusing pass from ${PASS_SHA:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Rust (toolchain, sccache)
        if: ${{ steps.pass.outputs.hit != 'true' }}
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Test + coverage (cargo nextest)
        if: ${{ steps.pass.outputs.hit != 'true' }}
        uses: argyle-labs/.github/.github/actions/cargo-test@main
      - name: Record pass
        if: ${{ success() && steps.pass.outputs.hit != 'true' }}
        uses: argyle-labs/.github/.github/actions/ci-pass-cache@main
        with:
          mode: record
          job: test
          hash: ${{ steps.src.outputs.hash }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

  lint:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust (toolchain, sccache)
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Format (cargo fmt)
        uses: argyle-labs/.github/.github/actions/cargo-fmt@main
      - name: Clippy
        uses: argyle-labs/.github/.github/actions/cargo-clippy@main
        if: ${{ !cancelled() }}
      - name: Lock file check
        uses: argyle-labs/.github/.github/actions/cargo-lock-check@main
        if: ${{ !cancelled() }}
      - name: actionlint
        uses: argyle-labs/.github/.github/actions/actionlint@main
        if: ${{ !cancelled() }}
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

  # Opt-in Dockerfile validation on PRs: uncomment to build the image without
  # pushing. Reads the :buildcache the Image workflow writes; never writes it.
