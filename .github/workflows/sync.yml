name: Sync Plex Versions

# Rebuilds the image for each of the newest upstream Plex releases as
# <registry>/argyle-labs/plex:<plex-version> and prunes version tags that fell
# out of the keep window. Only tags shaped like a Plex version are touched, so
# tree-*, buildcache and release tags are left alone.

on:
  schedule:
    - cron: '0 4 * * *'   # daily at 4 AM UTC
  workflow_dispatch:
    inputs:
      keep_versions:
        description: 'Number of Plex versions to keep'
        default: '5'
        required: false

concurrency:
  group: sync-plex-versions
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}
  REGISTRY_HTTP: ${{ vars.CI_REGISTRY_HTTP || 'false' }}
  IMAGE_OWNER: argyle-labs
  IMAGE_NAME: plex
  KEEP_VERSIONS: ${{ github.event.inputs.keep_versions || '5' }}
  VERSION_RE: '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]+$'

jobs:
  discover:
    name: Discover Plex versions
    runs-on: ubuntu-latest
    outputs:
      to_build: ${{ steps.plan.outputs.to_build }}
      to_delete: ${{ steps.plan.outputs.to_delete }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - name: Fetch upstream Plex versions
        id: upstream
        run: |
          set -euo pipefail
          PLEX_JSON=$(curl -fsSL 'https://plex.tv/api/downloads/5.json')
          VERSIONS=$(jq -r --argjson n "$KEEP_VERSIONS" \
            '[.computer.Linux.releases[] | select(.build == "linux-x86_64")] | .[0:$n] | .[].version' \
            <<< "$PLEX_JSON")
          {
            echo "upstream_versions<<EOF"
            echo "$VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch existing registry versions
        id: existing
        env:
          REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          scheme=https
          [ "$REGISTRY_HTTP" = "true" ] && scheme=http
          url="$scheme://$REGISTRY/v2/$IMAGE_OWNER/$IMAGE_NAME/tags/list"
          code=$(curl -sS -u "$REGISTRY_USER:$REGISTRY_TOKEN" -o tags.json -w '%{http_code}' "$url")
          case "$code" in
            200) EXISTING=$(jq -r '.tags // [] | .[]' tags.json | grep -E "$VERSION_RE" | sort -V || true) ;;
            404) EXISTING="" ;;
            *) echo "::error title=sync::listing tags at $url returned HTTP $code"; exit 1 ;;
          esac
          {
            echo "existing_versions<<EOF"
            echo "$EXISTING"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Plan builds and deletions
        id: plan
        env:
          UPSTREAM: ${{ steps.upstream.outputs.upstream_versions }}
          EXISTING: ${{ steps.existing.outputs.existing_versions }}
        run: |
          set -euo pipefail
          TO_BUILD=$(comm -23 <(echo "$UPSTREAM" | sort -V) <(echo "$EXISTING" | sort -V))
          TO_DELETE=$(comm -13 <(echo "$UPSTREAM" | sort -V) <(echo "$EXISTING" | sort -V))
          LATEST=$(echo "$UPSTREAM" | head -1)

          echo "Latest Plex: $LATEST"
          echo "To build:"; echo "$TO_BUILD"
          echo "To delete:"; echo "$TO_DELETE"

          {
            echo "to_build=$(echo "$TO_BUILD" | grep -v '^$' | jq -R . | jq -sc .)"
            echo "to_delete=$(echo "$TO_DELETE" | grep -v '^$' | jq -R . | jq -sc .)"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.version }}
    needs: discover
    if: needs.discover.outputs.to_build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.to_build) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Registry login
        uses: argyle-labs/.github/.github/actions/registry-login@main
        with:
          registry: ${{ env.REGISTRY }}
          registry-http: ${{ env.REGISTRY_HTTP }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ matrix.version }}
          LATEST: ${{ needs.discover.outputs.latest }}
        run: |
          repo="$REGISTRY/$IMAGE_OWNER/$IMAGE_NAME"
          TAGS="$repo:$VERSION"
          if [ "$VERSION" = "$LATEST" ]; then
            TAGS="$TAGS,$repo:latest"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.version }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            PLEX_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.repo }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

  prune:
    name: Prune old versions
    needs: [discover, build]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.to_delete != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old registry package versions
        env:
          REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.CI_REGISTRY_TOKEN }}
          TO_DELETE: ${{ needs.discover.outputs.to_delete }}
        run: |
          set -euo pipefail
          scheme=https
          [ "$REGISTRY_HTTP" = "true" ] && scheme=http
          for version in $(jq -r '.[]' <<< "$TO_DELETE"); do
            echo "Deleting version: $version"
            code=$(curl -sS -u "$REGISTRY_USER:$REGISTRY_TOKEN" -o /dev/null -w '%{http_code}' -X DELETE \
              "$scheme://$REGISTRY/api/v1/packages/$IMAGE_OWNER/container/$IMAGE_NAME/$version")
            case "$code" in
              204) echo "Deleted $version" ;;
              404) echo "Version $version not found, skipping" ;;
              *) echo "::error title=sync::deleting $version returned HTTP $code"; exit 1 ;;
            esac
          done
