name: Build and Push

# Builds the image with latest Plex whenever the Dockerfile or scripts change.
# For versioned Plex releases, see sync.yml (runs daily).

on:
  push:
    branches: [dev, stage, main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    branches: [dev, main]
    paths:
      - Dockerfile
      - scripts/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `secrets.GITHUB_TOKEN` is the RUNNER's built-in token. These workflows run
      # on Gitea runners, where that token is a *Gitea* token and can never
      # authenticate to ghcr.io — so this step failed on every push to main since
      # the workflow was written, and the push below was skipped. PR runs hid it:
      # login and push are both gated off for pull_request, so they went green
      # while never exercising the publish path. Use the org-level GH_TOKEN (a real
      # GitHub PAT with write:packages) and the repo owner as the username.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: PLEX_VERSION=latest
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # A broken cache backend must not fail the publish. Gitea's actcache
          # 500s with `open /root/.cache/actcache/bolt.db: no such file or
          # directory`, and BuildKit cancels sibling exporters when one errors —
          # so the image built for both arches, started pushing, then got
          # CANCELED by the cache export. `ignore-error` keeps the cache as the
          # pure optimization it is. The image itself is unaffected, which is why
          # this is safe to soft-fail: nothing about the deliverable is hidden.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64,linux/arm64
