name: Image

# Copy to .github/workflows/image.yml only in repos with a Dockerfile. Builds
# the image on every main commit and pushes <registry>/argyle-labs/<repo>:tree-<sha>
# (the commit's tree sha) for plugin-release to retag; skips the build when
# that tag already exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and push image
        uses: argyle-labs/.github/.github/actions/image-build@main
        with:
          file: Dockerfile
          name: argyle-labs/${{ github.event.repository.name }}
          registry: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}
          registry-http: ${{ vars.CI_REGISTRY_HTTP || 'false' }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}
